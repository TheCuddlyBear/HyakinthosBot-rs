services:
  hyakinthosbot:
      build: .
      environment:
        - DISCORD_TOKEN=${DISCORD_TOKEN}
        - LAVALINK_HOST=${LAVALINK_HOST}
        - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
        - LAVALINK_SSL=${LAVALINK_SSL}
        - BOT_PREFIX=${BOT_PREFIX}
        - REPLY_CHANCE=${REPLY_CHANCE}

      container_name: hyakinthosbot
      restart: unless-stopped
      volumes:
        - ./discord_mini_gpt.safetensors:/app/discord_mini_gpt.safetensors:ro
        - ./discord_tokenizer.json:/app/discord_tokenizer.json:ro