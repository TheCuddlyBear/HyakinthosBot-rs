services:
  hyakinthosbot:
      build: .
      environment:
        - DISCORD_TOKEN=${DISCORD_TOKEN}
        - LAVALINK_HOST=${LAVALINK_HOST}
        - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
        - LAVALINK_SSL=${LAVALINK_SSL}
        - BOT_PREFIX=${BOT_PREFIX}
        - REPLY_CHANCE=${REPLY_CHANCE}
        - HF_MODEL_REPO=${HF_MODEL_REPO:-TheCuddlyBear/HellGPT}
        - HF_TOKEN=${HF_TOKEN:-}

      container_name: hyakinthosbot
      restart: unless-stopped
      volumes:
        - ./models:/app/models
