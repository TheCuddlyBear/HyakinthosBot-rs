[package]
name = "HyakinthosBot"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15"
futures = "0.3"
rand="0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
candle-core = "0.8"
candle-nn = "0.8"
regex = "1.10"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

[dependencies.poise]
version = "0.6"
default-features = false
features = ["cache", "chrono", "handle_panics"]

[dependencies.serenity]
version = "0.12"
default-features = false
features = ["client", "gateway", "http", "model", "cache", "rustls_backend"]

[dependencies.songbird]
version = "0.5"
default-features = false
features = ["gateway", "serenity", "rustls"]

[dependencies.lavalink-rs]
version = "0.15"
default-features = false
features = ["songbird", "serenity", "tungstenite-rustls-webpki-roots", "macros"]
